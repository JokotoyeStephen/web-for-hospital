<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Signup (Patient & Doctor)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center py-10">

  <div class="bg-white w-full max-w-3xl rounded-2xl shadow-lg overflow-hidden">
    <!-- Header Tabs -->
    <div class="flex">
      <button id="patientTab" class="flex-1 text-center py-3 font-semibold bg-blue-600 text-white transition">Register as Patient</button>
      <button id="doctorTab" class="flex-1 text-center py-3 font-semibold bg-gray-200 text-gray-700 hover:bg-gray-300 transition">Register as Doctor</button>
    </div>

    <!-- PATIENT FORM -->
    <div id="patientForm" class="p-8 space-y-4">
      <h2 class="text-xl font-bold text-center mb-4">Patient Registration</h2>

      <form id="patientSignup" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Full Name</label>
          <input id="pName" type="text" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input id="pEmail" type="email" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Phone Number</label>
          <input id="pPhone" type="tel" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Gender</label>
          <select id="pGender" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
            <option value="">Select gender</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium">Date of Birth</label>
          <input id="pDob" type="date" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
        </div>
        <div class="relative">
          <label class="block text-sm font-medium">Password</label>
          <input id="pPassword" type="password" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
          <i class="bx bx-hide absolute right-3 top-9 text-xl cursor-pointer text-gray-500" onclick="togglePassword('pPassword', this)"></i>
        </div>
        <div class="relative">
          <label class="block text-sm font-medium">Confirm Password</label>
          <input id="pConfirm" type="password" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-blue-300" required>
          <i class="bx bx-hide absolute right-3 top-9 text-xl cursor-pointer text-gray-500" onclick="togglePassword('pConfirm', this)"></i>
        </div>
        <p id="pError" class="text-red-500 text-sm hidden"></p>
        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Register</button>
      </form>
    </div>

    <!-- DOCTOR FORM -->
    <div id="doctorForm" class="p-8 space-y-4 hidden">
      <h2 class="text-xl font-bold text-center mb-4">Doctor Registration</h2>

      <form id="doctorSignup" class="space-y-4">
        <div>
          <label class="block text-sm font-medium">Full Name</label>
          <input id="dName" type="text" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input id="dEmail" type="email" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Specialization</label>
          <input id="dSpecialty" type="text" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Phone Number</label>
          <input id="dPhone" type="tel" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
        </div>
        <div>
          <label class="block text-sm font-medium">Years of Experience</label>
          <input id="dExperience" type="number" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
        </div>
        <div class="relative">
          <label class="block text-sm font-medium">Password</label>
          <input id="dPassword" type="password" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
          <i class="bx bx-hide absolute right-3 top-9 text-xl cursor-pointer text-gray-500" onclick="togglePassword('dPassword', this)"></i>
        </div>
        <div class="relative">
          <label class="block text-sm font-medium">Confirm Password</label>
          <input id="dConfirm" type="password" class="w-full px-4 py-2 border rounded-lg focus:ring focus:ring-green-300" required>
          <i class="bx bx-hide absolute right-3 top-9 text-xl cursor-pointer text-gray-500" onclick="togglePassword('dConfirm', this)"></i>
        </div>
        <p id="dError" class="text-red-500 text-sm hidden"></p>
        <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">Register</button>
      </form>
    </div>

    <!-- OTP Verification Section -->
    <div id="otpSection" class="hidden p-8 text-center space-y-4">
      <h3 class="text-lg font-semibold">Email Verification</h3>
      <p class="text-gray-600">Enter the OTP sent to your email</p>
      <input id="otpInput" maxlength="6" class="w-full text-center border rounded-lg py-2" placeholder="Enter 6-digit OTP">
      <p id="otpError" class="text-red-500 text-sm hidden">Invalid OTP, please try again.</p>
      <button id="verifyOtpBtn" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Verify</button>
      <p id="resendOtp" class="text-blue-600 cursor-pointer hover:underline">Resend OTP</p>
    </div>
  </div>

  <script src="./sign_up.js"></script>

</body>
</html>
